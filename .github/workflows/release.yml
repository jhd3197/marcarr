name: Release

# When a GitHub release is published, build what people install:
#   * container images (linux/amd64 + linux/arm64) on GHCR, and on Docker Hub if configured
#   * the portable Windows bundle, attached to the release as a zip
# publish.yml uploads the package to PyPI from the same event.
#
# Nothing here re-runs the test suite: a release is cut from main, where CI has already run on
# this exact commit. The tag must match the version in marcarr/__init__.py.
#
# Optional secrets (Settings > Secrets and variables > Actions) for Docker Hub:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   -> also pushes <user>/marcarr
on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: the tag is the package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('marcarr/__init__.py').read_text()).group(1))")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The release tag is $TAG but marcarr/__init__.py says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  docker:
    name: container images
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Which registries
        id: images
        run: |
          # GHCR names must be lower case.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "list<<EOF"
            echo "ghcr.io/$owner/marcarr"
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "${DOCKERHUB_USERNAME,,}/marcarr"
            fi
            echo "EOF"
            echo "ghcr=ghcr.io/$owner/marcarr"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          # v0.1.2 -> 0.1.2, 0.1 and latest. Pre-releases (v0.2.0-rc1) get only their own tag.
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=sha
          labels: |
            org.opencontainers.image.title=Marcarr
            org.opencontainers.image.description=Looks at each video in your Plex library once: scenes, faces, cast and tags
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image is publicly readable
        env:
          IMAGE: ${{ steps.images.outputs.ghcr }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          if ! DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" docker manifest inspect "$IMAGE:$VERSION" > /dev/null; then
            echo "::error::The image was published but is not publicly readable. GHCR creates new packages as private: set the marcarr package to Public under the repository's Packages settings."
            exit 1
          fi

  windows:
    name: windows bundle
    needs: version
    permissions:
      contents: write   # attaches the zip to the release
    uses: ./.github/workflows/package-windows.yml
    with:
      build-ui: true
      release-tag: ${{ github.event.release.tag_name }}
