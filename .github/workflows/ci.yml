name: CI

# One run per change. Pull requests run it on the PR; pushes run it on dev and main only
# (the merged result). A dev -> main promotion PR skips the PR run, because the push to dev
# already ran every check on that exact commit and shows on the PR.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[faces,mcp,dev]"
      - run: ruff check .
      - run: pytest -q

  ui:
    name: web UI (typecheck, tests, build)
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # The Windows build reuses this build instead of building the UI a second time.
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  docker:
    name: docker build and smoke test
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: marcarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and check the API, the UI and ffmpeg
        run: scripts/docker-smoke.sh marcarr:ci

  windows:
    name: windows bundle
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    needs: ui
    uses: ./.github/workflows/package-windows.yml
    with:
      build-ui: false
