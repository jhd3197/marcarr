name: Publish to PyPI

# Runs when a GitHub release is published. The release's tag must be the version in
# marcarr/__init__.py with a "v" in front (v0.1.1), so what is on PyPI is what was tagged.
#
# Uploads with the PYPI_TOKEN repository secret, the same way Prompture does.
# Create a token scoped to the marcarr project and add it as PYPI_TOKEN
# under Settings > Secrets and variables > Actions.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the web UI into the package
        run: |
          cd ui
          npm ci
          npm run build
          cp -r dist ../marcarr/ui

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag is the package version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('marcarr/__init__.py').read_text()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The release tag is $GITHUB_REF_NAME but marcarr/__init__.py says $version" >&2
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python -m zipfile -l dist/*.whl | grep -q "marcarr/ui/index.html"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload dist/* --non-interactive
